# This workflow builds and deploys your website

name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js (если используете)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
      
      - name: Run tests (если есть)
        run: npm test
      
      - name: Deploy to production (только для main)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "🚀 Deploying to PRODUCTION..."
          # Здесь ваша команда деплоя (например, на хостинг)
          # rsync -avz --delete ./dist/ user@server:/var/www/html/
      
      - name: Deploy to staging (только для develop)
        if: github.ref == 'refs/heads/develop'
        run: |
          echo "🧪 Deploying to STAGING..."
          # Здесь ваша команда деплоя на стейджинг
          # rsync -avz --delete ./dist/ user@staging-server:/var/www/html/
