<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Congi View - Загрузка</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="Assets\images\icon\logo.png">
</head>
<body>

    <!-- 1. Прелоадер (Экран загрузки) -->
    <div id="preloader">
        <div class="loader-spinner"></div>
        <div class="loader-text">Загрузка Congi View...</div>
    </div>

    <!-- 2. Основной контент с логотипом -->
    <div id="main-content" class="hidden">
        <div class="logo-container">
            
            <!-- ВАШЕ ИЗОБРАЖЕНИЕ -->
            <!-- Убедитесь, что путь совпадает с вашей структурой папок -->
            <img src="Assets\images\icon\logo.png" alt="Congi View Logo" class="logo-image">
            
            <!-- Название компании -->
            <h1 class="logo-text">Congi <span>View</span></h1>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
